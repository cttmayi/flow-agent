<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flow-agent</title>
<link rel="stylesheet" href="/highlight.css">
<style>
/* Layout */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; background: #1a1a2e; color: #e0e0e0; }

/* Sidebar */
.sidebar { width: 240px; min-width: 240px; background: #16213e; display: flex; flex-direction: column; border-right: 1px solid #0f3460; }
.sidebar-header { padding: 12px; border-bottom: 1px solid #0f3460; }
.sidebar-header h1 { font-size: 16px; color: #e94560; }
.btn-new { width: 100%; margin-top: 8px; padding: 6px 12px; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
.btn-new:hover { background: #d63850; }
.workflow-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.workflow-item { padding: 8px 12px; cursor: pointer; font-size: 14px; border-left: 3px solid transparent; }
.workflow-item:hover { background: rgba(255,255,255,0.05); }
.workflow-item.active { background: rgba(233,69,96,0.15); border-left-color: #e94560; color: #e94560; }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.top-bar { padding: 8px 16px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 8px; }
.top-bar .wf-name { font-size: 14px; font-weight: 600; flex: 1; }
.top-bar .wf-name .ext { color: #666; font-weight: normal; }
.btn { padding: 4px 12px; border: 1px solid #0f3460; border-radius: 4px; background: transparent; color: #e0e0e0; cursor: pointer; font-size: 12px; }
.btn:hover { background: rgba(255,255,255,0.1); }
.btn-primary { background: #e94560; border-color: #e94560; color: white; }
.btn-primary:hover { background: #d63850; }
.btn-code { background: #0f3460; border-color: #0f3460; }

/* Chat */
.chat-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.chat-msg { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.6; word-break: break-word; }
.chat-msg.user { align-self: flex-end; background: #e94560; color: white; }
.chat-msg.assistant { align-self: flex-start; background: #16213e; border: 1px solid #0f3460; }
.chat-msg p { margin: 4px 0; }
.chat-msg h1, .chat-msg h2, .chat-msg h3 { margin: 8px 0 4px; }
.chat-msg ul, .chat-msg ol { margin: 4px 0; padding-left: 20px; }
.chat-msg li { margin: 2px 0; }
.chat-msg code { background: rgba(0,0,0,0.3); padding: 1px 4px; border-radius: 3px; font-size: 13px; }
.chat-msg pre { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px; margin: 4px 0; overflow-x: auto; }
.chat-msg a { color: #4fc3f7; }
.chat-msg strong { font-weight: 600; }

/* Input */
.input-bar { padding: 12px 16px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 8px; }
.input-bar textarea { flex: 1; padding: 8px; border: 1px solid #0f3460; border-radius: 4px; background: #1a1a2e; color: #e0e0e0; font-size: 14px; resize: none; min-height: 20px; max-height: 120px; outline: none; }
.input-bar textarea:focus { border-color: #e94560; }
.btn-send { padding: 8px 20px; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; align-self: flex-end; }
.btn-send:hover { background: #d63850; }
.btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

/* Modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 100; }
.modal-overlay.show { display: flex; }
.modal { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 24px; width: 420px; max-width: 90vw; }
.modal h2 { margin-bottom: 16px; font-size: 18px; }
.modal label { display: block; font-size: 13px; margin-bottom: 4px; color: #999; }
.modal input, .modal textarea { width: 100%; padding: 8px; border: 1px solid #0f3460; border-radius: 4px; background: #1a1a2e; color: #e0e0e0; margin-bottom: 12px; outline: none; }
.modal textarea { min-height: 80px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* Code viewer */
.code-viewer { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 100; }
.code-viewer.show { display: flex; }
.code-viewer .modal { width: 700px; max-width: 90vw; max-height: 80vh; }
.code-viewer pre { background: #1a1a2e; padding: 12px; border-radius: 4px; overflow: auto; max-height: 60vh; font-size: 13px; line-height: 1.6; }

/* Empty state */
.empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #555; font-size: 14px; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <h1>flow-agent</h1>
    <button class="btn-new" onclick="showNewModal()">+ 新建</button>
  </div>
  <div class="workflow-list" id="workflowList"></div>
</div>

<div class="main">
  <div class="top-bar" id="topBar" style="display:none">
    <span class="wf-name" id="wfName"></span>
    <button class="btn btn-primary" onclick="runWorkflow()">执行</button>
    <button class="btn btn-code" onclick="showCode()">查看代码</button>
  </div>
  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">选择一个 workflow 开始</div>
  </div>
  <div class="input-bar" id="inputBar" style="display:none">
    <textarea id="chatInput" rows="1" placeholder="输入指令修改 workflow..." onkeydown="onInputKeydown(event)"></textarea>
    <button class="btn-send" id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
</div>

<!-- New Workflow Modal -->
<div class="modal-overlay" id="newModal">
  <div class="modal">
    <h2>新建 Workflow</h2>
    <label>名称</label>
    <input id="newName" placeholder="my-workflow">
    <label>描述</label>
    <textarea id="newDesc" placeholder="描述这个 workflow 的功能..."></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeNewModal()">取消</button>
      <button class="btn btn-primary" onclick="createWorkflow()">创建</button>
    </div>
  </div>
</div>

<!-- Code Viewer -->
<div class="code-viewer" id="codeViewer">
  <div class="modal">
    <h2 id="codeViewerTitle">代码</h2>
    <pre id="codeViewerContent"></pre>
    <div class="modal-actions">
      <button class="btn" onclick="closeCodeViewer()">关闭</button>
    </div>
  </div>
</div>

<script src="/marked.min.js"></script>
<script src="/highlight.min.js"></script>
<script>
let workflows = [];
let activeWorkflow = null;
let loadingMessages = false;
let loadingSend = false;
let loadingRun = false;

function escapeHTML(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// === API Helpers ===
async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// === Sidebar ===
async function loadWorkflows() {
  try {
    workflows = await api('/api/workflows');
  } catch {
    return;
  }
  const list = document.getElementById('workflowList');
  list.innerHTML = '';
  for (const w of workflows) {
    const item = document.createElement('div');
    item.className = 'workflow-item' + (w === activeWorkflow ? ' active' : '');
    item.textContent = w;
    item.addEventListener('click', () => selectWorkflow(w));
    list.appendChild(item);
  }
}

function selectWorkflow(name) {
  activeWorkflow = name;
  loadingMessages = name;
  document.querySelectorAll('.workflow-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.workflow-item').forEach(el => {
    if (el.textContent === name) el.classList.add('active');
  });
  document.getElementById('topBar').style.display = 'flex';
  document.getElementById('inputBar').style.display = 'flex';
  document.getElementById('wfName').textContent = name + '.js';
  loadMessages(name);
}

async function loadMessages(name) {
  const area = document.getElementById('chatArea');
  area.innerHTML = '<div class="empty-state" style="display:none"></div>';
  try {
    const { messages } = await api(`/api/workflows/${encodeURIComponent(name)}/messages`);
    if (loadingMessages !== name) return; // stale response
    loadingMessages = false;
    messages.forEach(m => appendMessage(m.role, m.content, false));
    area.scrollTop = area.scrollHeight;
  } catch {
    if (loadingMessages === name) loadingMessages = false;
  }
}

// === Chat ===
function appendMessage(role, content, doScroll = true) {
  const area = document.getElementById('chatArea');
  const empty = document.getElementById('emptyState');
  if (empty) empty.style.display = 'none';

  // content may be a content block array from tool_use loop; extract text blocks
  if (Array.isArray(content)) {
    // Skip messages that contain tool_use blocks (intermediate assistant responses)
    if (content.some(b => b.type === 'tool_use')) return;
    content = content.filter(b => b.type === 'text').map(b => b.text).join('\n');
  }

  // Skip empty messages (tool results, etc.)
  if (!content || !content.trim()) return;

  // Escape HTML, then render markdown via marked
  const formatted = marked.parse(escapeHTML(content), { breaks: true });

  const div = document.createElement('div');
  div.className = `chat-msg ${role}`;
  div.innerHTML = formatted;

  // Highlight code blocks with hljs
  div.querySelectorAll('pre code').forEach(block => {
    hljs.highlightElement(block);
  });

  area.appendChild(div);
  if (doScroll) area.scrollTop = area.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text || loadingSend || !activeWorkflow) return;

  input.value = '';
  loadingSend = true;
  btn.disabled = true;

  appendMessage('user', text);

  try {
    const data = await api(`/api/workflows/${encodeURIComponent(activeWorkflow)}/chat`, {
      method: 'POST',
      body: JSON.stringify({ message: text }),
    });
    appendMessage('assistant', data.reply);
  } catch (err) {
    appendMessage('assistant', `错误：${escapeHTML(err.message)}`);
  } finally {
    loadingSend = false;
    btn.disabled = loadingRun;
    input.focus();
  }
}

function onInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    sendMessage();
  }
}

// === Execute ===
async function runWorkflow() {
  if (!activeWorkflow || loadingRun) return;
  loadingRun = true;
  document.getElementById('sendBtn').disabled = true;

  appendMessage('user', `执行 workflow "${activeWorkflow}"`);

  try {
    const data = await api(`/api/workflows/${encodeURIComponent(activeWorkflow)}/run`, { method: 'POST' });
    appendMessage('assistant', `\`\`\`\n${data.result || '(无返回结果)'}\n\`\`\``);
  } catch (err) {
    appendMessage('assistant', `执行失败：${escapeHTML(err.message)}`);
  } finally {
    loadingRun = false;
    document.getElementById('sendBtn').disabled = loadingSend;
  }
}

// === New Workflow ===
function showNewModal() {
  document.getElementById('newModal').classList.add('show');
}

function closeNewModal() {
  document.getElementById('newModal').classList.remove('show');
  document.getElementById('newName').value = '';
  document.getElementById('newDesc').value = '';
}

async function createWorkflow() {
  const name = document.getElementById('newName').value.trim();
  const desc = document.getElementById('newDesc').value.trim();
  if (!name || !desc) return;

  closeNewModal();

  try {
    await api('/api/workflows', {
      method: 'POST',
      body: JSON.stringify({ name, description: desc }),
    });
    await loadWorkflows();
    selectWorkflow(name);
  } catch (err) {
    appendMessage('assistant', `创建失败：${err.message}`);
  }
}

// === Code Viewer ===
async function showCode() {
  if (!activeWorkflow) return;
  try {
    const data = await api(`/api/workflows/${encodeURIComponent(activeWorkflow)}`);
    document.getElementById('codeViewerTitle').textContent = `${activeWorkflow}.js`;
    document.getElementById('codeViewerContent').textContent = data.code;
    document.getElementById('codeViewer').classList.add('show');
  } catch (err) {
    appendMessage('assistant', `加载代码失败：${escapeHTML(err.message)}`);
  }
}

function closeCodeViewer() {
  document.getElementById('codeViewer').classList.remove('show');
}

// === Modal overlay click-to-close ===
document.getElementById('newModal').addEventListener('click', function(e) {
  if (e.target === this) closeNewModal();
});
document.getElementById('codeViewer').addEventListener('click', function(e) {
  if (e.target === this) closeCodeViewer();
});

// === Textarea auto-resize ===
document.getElementById('chatInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// === Init ===
loadWorkflows();
</script>
</body>
</html>
