<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flow-agent</title>
<link rel="stylesheet" href="/highlight.css">
<style>
/* Layout */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; background: #1a1a2e; color: #e0e0e0; }

/* Sidebar */
.sidebar { width: 240px; min-width: 240px; background: #16213e; display: flex; flex-direction: column; border-right: 1px solid #0f3460; transition: width 0.2s, min-width 0.2s, border 0.2s; overflow: hidden; }
.sidebar.collapsed { width: 0; min-width: 0; border-right: none; }
.sidebar-header { padding: 12px; border-bottom: 1px solid #0f3460; }
.sidebar-header h1 { font-size: 16px; color: #e94560; }
.btn-new { width: 100%; margin-top: 8px; padding: 6px 12px; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
.btn-new:hover { background: #d63850; }
.workflow-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.wf-group-label { padding: 6px 12px 2px; font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
.workflow-item { padding: 6px 12px; cursor: pointer; font-size: 14px; border-left: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.workflow-item:hover { background: rgba(255,255,255,0.05); }
.workflow-item.active { background: rgba(233,69,96,0.15); border-left-color: #e94560; color: #e94560; }
.workflow-item .wf-name-text { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.workflow-item .wf-source { font-size: 10px; color: #666; background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; flex-shrink: 0; }
.workflow-item .wf-copy { font-size: 11px; color: #555; cursor: pointer; padding: 0 4px; flex-shrink: 0; display: none; }
.workflow-item:hover .wf-copy { display: inline; }
.workflow-item .wf-copy:hover { color: #4fc3f7; }
.workflow-item .wf-del { font-size: 13px; color: #555; cursor: pointer; padding: 0 4px; flex-shrink: 0; display: none; }
.workflow-item:hover .wf-del { display: inline; }
.workflow-item .wf-del:hover { color: #e94560; }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 6px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }
.toast.info { background: #16213e; border: 1px solid #0f3460; color: #e0e0e0; }
.toast.success { background: #1b5e20; color: white; }
.toast.error { background: #b71c1c; color: white; }
.btn-collapse { background: none; border: none; color: #666; cursor: pointer; font-size: 11px; padding: 2px 6px; border-radius: 3px; line-height: 1; }
.btn-collapse:hover { color: #e0e0e0; background: rgba(255,255,255,0.1); }

/* Main container (main + divider + code-panel) */
.main-container { flex: 1; display: flex; min-width: 0; }

/* Main chat area */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.top-bar { padding: 8px 16px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 8px; }
.top-bar .wf-name { font-size: 14px; font-weight: 600; flex: 1; }
.top-bar .wf-name .ext { color: #666; font-weight: normal; }
.btn { padding: 4px 12px; border: 1px solid #0f3460; border-radius: 4px; background: transparent; color: #e0e0e0; cursor: pointer; font-size: 12px; }
.btn:hover { background: rgba(255,255,255,0.1); }
.btn-primary { background: #e94560; border-color: #e94560; color: white; }
.btn-primary:hover { background: #d63850; }
.btn-code { background: #0f3460; border-color: #0f3460; }

/* Chat */
.chat-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.chat-msg { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.6; word-break: break-word; }
.chat-msg.user { align-self: flex-end; background: #e94560; color: white; }
.chat-msg.assistant { align-self: flex-start; background: #16213e; border: 1px solid #0f3460; }
.chat-msg p { margin: 4px 0; }
.chat-msg h1, .chat-msg h2, .chat-msg h3 { margin: 8px 0 4px; }
.chat-msg ul, .chat-msg ol { margin: 4px 0; padding-left: 20px; }
.chat-msg li { margin: 2px 0; }
.chat-msg code { background: rgba(0,0,0,0.3); padding: 1px 4px; border-radius: 3px; font-size: 13px; }
.chat-msg pre { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px; margin: 4px 0; overflow-x: auto; }
.chat-msg a { color: #4fc3f7; }
.chat-msg strong { font-weight: 600; }

/* Thinking indicator */
.thinking-dots { color: #888; font-size: 14px; }
.thinking-dots .dot { animation: blink 1.4s infinite; font-weight: bold; }
.thinking-dots .dot:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots .dot:nth-child(3) { animation-delay: 0.4s; }
.thinking-dots .dot:nth-child(4) { animation-delay: 0.6s; }
@keyframes blink { 0%, 20% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

/* Input */
.input-bar { padding: 12px 16px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 8px; }
.input-bar textarea { flex: 1; padding: 8px; border: 1px solid #0f3460; border-radius: 4px; background: #1a1a2e; color: #e0e0e0; font-size: 14px; resize: none; min-height: 20px; max-height: 120px; outline: none; }
.input-bar textarea:focus { border-color: #e94560; }
.btn-send { padding: 8px 20px; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; align-self: flex-end; }
.btn-send:hover { background: #d63850; }
.btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

/* Modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 100; }
.modal-overlay.show { display: flex; }
.modal { background: #1a1a2e; border: 1px solid #333; border-radius: 12px; padding: 28px; width: 420px; max-width: 90vw; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.modal h2 { margin-bottom: 20px; font-size: 18px; color: #e0e0e0; }
.modal label { display: block; font-size: 13px; margin-bottom: 6px; color: #888; font-weight: 500; }
.modal input, .modal textarea { width: 100%; padding: 10px 12px; border: 1px solid #333; border-radius: 8px; background: #111827; color: #e0e0e0; margin-bottom: 16px; outline: none; font-size: 14px; transition: border-color 0.15s; }
.modal input:focus, .modal textarea:focus { border-color: #e94560; }
.modal textarea { min-height: 80px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* Divider */
.divider { width: 5px; cursor: col-resize; background: #0f3460; flex-shrink: 0; position: relative; z-index: 10; display: none; }
.divider.show { display: block; }
.divider:hover, .divider.active { background: #e94560; }

/* Code panel */
.code-panel { width: 0; overflow: hidden; background: #111827; border-left: 1px solid #0f3460; display: flex; flex-direction: column; }
.code-panel.open { /* width set by JS for 50/50 split */ }
.code-panel.open.transition { transition: width 0.2s; }
.code-panel-header { padding: 8px 12px; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 8px; font-size: 13px; }
.code-panel-header .cp-name { flex: 1; font-weight: 600; }
.code-panel-header .cp-name .ext { color: #666; font-weight: normal; }
.code-panel-body { flex: 1; overflow: hidden; padding: 0; position: relative; }
.cp-editor-container { position: absolute; inset: 0; }
.cp-editor-container pre { position: absolute; inset: 0; margin: 0; padding: 12px; font-size: 13px; line-height: 1.6; pointer-events: none; overflow: hidden; }
.cp-editor-container pre code { display: inline-block; min-width: 100%; }
.cp-editor-container pre code { background: transparent; padding: 0; font-size: 13px; white-space: pre; word-break: normal; }
.cp-editor { position: absolute; inset: 0; width: 100%; height: 100%; padding: 12px; border: none; outline: none; background: transparent; color: transparent; caret-color: #e0e0e0; font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; font-size: 13px; line-height: 1.6; resize: none; tab-size: 2; white-space: pre; overflow: auto; }
.code-panel-files { border-bottom: 1px solid #0f3460; overflow-y: auto; padding: 2px 0; font-size: 12px; }
.cp-file { padding: 2px 8px 2px 12px; cursor: pointer; color: #aaa; white-space: nowrap; display: flex; align-items: center; gap: 3px; }
.cp-file:hover { background: rgba(255,255,255,0.05); color: #e0e0e0; }
.cp-file.active { background: rgba(233,69,96,0.15); color: #e94560; }
.cp-file .arrow { display: inline-block; width: 12px; text-align: center; flex-shrink: 0; font-size: 10px; color: #666; }
.cp-file .icon { flex-shrink: 0; }
.cp-file.dir { cursor: pointer; }
.cp-file.dir .arrow { color: #888; }
.cp-children { overflow: hidden; }
.cp-children.collapsed { display: none; }

/* Progress modal */
.phase-item { padding: 4px 0; color: #e0e0e0; display: flex; align-items: center; gap: 6px; font-size: 13px; }
.phase-item .spinner { display: inline-block; width: 12px; text-align: center; animation: spin 1s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* Empty state */
.empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #555; font-size: 14px; }

/* Create mode banner */
.create-banner { background: linear-gradient(90deg, #1a73e8, #4285f4); color: #fff; padding: 8px 16px; display: none; align-items: center; gap: 12px; font-size: 13px; flex-shrink: 0; }
.create-banner.active { display: flex; }
.create-banner .badge { background: rgba(255,255,255,0.2); padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.create-banner .phase-steps { display: flex; gap: 4px; margin-left: auto; font-size: 12px; }
.create-banner .phase-step { opacity: 0.6; }
.create-banner .phase-step.active { opacity: 1; font-weight: 600; }
.create-banner .phase-step.done { opacity: 0.8; }
.create-banner .btn-exit { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.create-banner .btn-exit:hover { background: rgba(255,255,255,0.3); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h1>flow-agent</h1>
      <button class="btn-collapse" onclick="toggleSidebar()" title="折叠侧栏">◀</button>
    </div>
    <button class="btn-new" onclick="startCreateWorkflow()">+ 新建</button>
  </div>
  <div class="workflow-list" id="workflowList"></div>
</div>

<div class="main-container">
  <div class="main">
    <div class="top-bar" id="topBar" style="display:none">
      <button class="btn btn-expand" id="expandBtn" onclick="toggleSidebar()" title="展开侧栏" style="display:none">▶</button>
      <span class="wf-name" id="wfName"></span>
      <button class="btn btn-primary" onclick="runWorkflow()">执行</button>
      <button class="btn btn-code" onclick="toggleCodePanel()">查看代码</button>
    </div>
    <div class="create-banner" id="createBanner">
      <span class="badge">新建模式</span>
      <span id="createBannerName">Workflow</span>
      <span class="phase-steps" id="phaseSteps"></span>
      <button class="btn-exit" onclick="exitCreateMode()">退出</button>
    </div>
    <div class="chat-area" id="chatArea">
      <div class="empty-state" id="emptyState">选择一个 workflow 开始</div>
    </div>
    <div class="input-bar" id="inputBar" style="display:none">
      <textarea id="chatInput" rows="1" placeholder="输入指令修改 workflow..." onkeydown="onInputKeydown(event)"></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <!-- Divider -->
  <div class="divider" id="divider"></div>

  <!-- Code Panel -->
  <div class="code-panel" id="codePanel">
    <div class="code-panel-header">
      <span class="cp-name" id="cpName"><span class="ext">代码</span></span>
      <button class="btn" id="cpSaveBtn" onclick="saveCpFile()" style="display:none">保存</button>
      <button class="btn" onclick="toggleCodePanel()">关闭</button>
    </div>
    <div class="code-panel-files" id="cpFileList"></div>
    <div class="code-panel-body">
      <div class="cp-editor-container">
        <pre><code id="cpHighlight" class="language-javascript"></code></pre>
        <textarea id="cpContent" class="cp-editor" spellcheck="false" wrap="off" oninput="onCpEdit()" onscroll="syncCpScroll()" onkeydown="onCpKeydown(event)"></textarea>
      </div>
    </div>
  </div>
</div>

<!-- Progress Modal -->
<div class="modal-overlay" id="progressModal">
  <div class="modal" style="width:560px">
    <h2>执行中...</h2>
    <div id="progressPhases" style="margin:12px 0; max-height:200px; overflow-y:auto; font-size:13px; line-height:1.8;"></div>
    <div id="progressOutput" style="margin:0 0 12px; padding:8px 12px; background:#0a1628; border:1px solid #0f3460; border-radius:4px; max-height:200px; overflow-y:auto; font-size:12px; font-family:'SF Mono','Menlo','Consolas',monospace; white-space:pre-wrap; word-break:break-all; color:#8ab4f8; display:none;"></div>
    <div class="modal-actions">
      <button class="btn" disabled>请等待</button>
    </div>
  </div>
</div>

<!-- New Workflow Modal -->
<div class="modal-overlay" id="newModal">
  <div class="modal">
    <h2 id="newModalTitle">新建 Workflow</h2>
    <label>名称</label>
    <input id="newName" placeholder="my-workflow">
    <div id="newDescRow">
    <label>描述</label>
    <textarea id="newDesc" placeholder="描述这个 workflow 的功能..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeNewModal()">取消</button>
      <button class="btn btn-primary" onclick="createWorkflow()">创建</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal" style="width:380px">
    <h2 id="confirmTitle">确认</h2>
    <p id="confirmText" style="margin:12px 0;font-size:14px;line-height:1.6;"></p>
    <div class="modal-actions">
      <button class="btn" id="confirmCancelBtn" onclick="closeConfirmModal()">取消</button>
      <button class="btn btn-primary" id="confirmOkBtn">确定</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/marked.min.js"></script>
<script src="/highlight.min.js"></script>
<script>
let workflows = [];
let activeWorkflow = null;
let loadingMessages = false;
let loadingSend = false;
let loadingRun = false;
let sidebarOpen = true;
let codePanelOpen = false;
let codePanelFiles = [];
let cpCurrentFile = 'main.js';

// Create mode state
let createMode = null;
const CREATE_PHASES = ['requirements', 'design', 'generate', 'review', 'verify'];
const CREATE_LABELS = { requirements: '需求收集', design: '架构设计', generate: '编码生成', review: '代码审查', verify: '快速验证' };

function escapeHTML(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// === Create Mode ===
function showCreateBanner() {
  const banner = document.getElementById('createBanner');
  banner.classList.add('active');
  document.getElementById('createBannerName').textContent = createMode.name;
  const steps = document.getElementById('phaseSteps');
  const idx = CREATE_PHASES.indexOf(createMode.phase);
  steps.innerHTML = CREATE_PHASES.map((p, i) => {
    let cls = 'phase-step';
    if (i < idx) cls += ' done';
    else if (i === idx) cls += ' active';
    return `<span class="${cls}">${i+1}. ${CREATE_LABELS[p]}</span>`;
  }).join(' › ');
}

function hideCreateBanner() {
  document.getElementById('createBanner').classList.remove('active');
}

async function startCreateWorkflow() {
  if (createMode) return;
  // Use existing modal for name input
  document.getElementById('newModalTitle').textContent = '新建 Workflow（分步生成）';
  document.getElementById('newDescRow').style.display = 'none';
  document.getElementById('newName').value = '';
  document.getElementById('newModal').classList.add('show');
  document.getElementById('newName').focus();
  // Override confirm for create mode
  window._createModePending = true;
}

async function startCreateSession() {
  const name = document.getElementById('newName').value.trim();
  if (!name) return;
  document.getElementById('newModal').classList.remove('show');
  document.getElementById('newName').value = '';
  document.getElementById('newDescRow').style.display = '';
  window._createModePending = false;

  createMode = {
    sessionId: null,
    phase: 'requirements',
    name: name,
    context: {},
  };

  // Switch to create mode UI
  document.getElementById('topBar').style.display = 'none';
  document.getElementById('inputBar').style.display = 'flex';
  document.getElementById('chatInput').placeholder = '描述你想创建的 workflow...';
  document.getElementById('chatInput').value = '';
  document.getElementById('chatInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('codePanel').style.display = 'none';
  document.querySelectorAll('.workflow-item').forEach(el => el.classList.remove('active'));

  showCreateBanner();

  // Clear chat area
  const area = document.getElementById('chatArea');
  area.innerHTML = '';

  // Immediately create session and get greeting from backend
  await sendCreateMessage('');
}

function exitCreateMode() {
  if (!createMode) return;
  if (!confirm('确定退出新建模式？未保存的内容将丢失。')) return;
  createMode = null;
  hideCreateBanner();
  document.getElementById('topBar').style.display = 'none';
  document.getElementById('inputBar').style.display = 'none';
  document.getElementById('chatInput').placeholder = '输入指令修改 workflow...';
  document.getElementById('chatArea').innerHTML = '<div class="empty-state" id="emptyState">选择一个 workflow 开始</div>';
  loadWorkflows();
}

async function sendCreateMessage(text, thinkingId) {
  if (!createMode) return;

  try {
    const body = {
      sessionId: createMode.sessionId,
      phase: createMode.phase,
      name: createMode.name,
      context: createMode.context,
    };
    if (text) body.message = text;
    const res = await fetch('/api/workflows/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');

    createMode.sessionId = data.sessionId;

    // Show assistant response
    if (data.message) {
      appendMessage('assistant', data.message);
    }

    // Handle status
    if (data.status === 'approved') {
      if (data.context) createMode.context = data.context;

      // Advance to next phase
      const idx = CREATE_PHASES.indexOf(createMode.phase);
      if (idx < CREATE_PHASES.length - 1) {
        createMode.phase = CREATE_PHASES[idx + 1];
        showCreateBanner();
        // Auto-advance for generate, review, verify
        if (['generate', 'review', 'verify'].includes(createMode.phase)) {
          document.getElementById('chatInput').disabled = true;
          document.getElementById('sendBtn').disabled = true;
          // Show thinking indicator
          const thinkingId = 'thinking-' + Date.now();
          appendThinking(thinkingId, CREATE_LABELS[createMode.phase]);
          setTimeout(() => sendCreateMessage('[自动开始]', thinkingId), 300);
        } else {
          document.getElementById('chatInput').disabled = false;
          document.getElementById('sendBtn').disabled = false;
          document.getElementById('chatInput').placeholder = createMode.phase === 'design'
            ? '请审阅设计方案，输入确认或修改意见...'
            : '输入...';
        }
      } else {
        // All phases complete
        appendMessage('assistant', `✅ Workflow "${createMode.name}" 创建完成！\n\n请点击左侧列表查看。`);
        createMode = null;
        hideCreateBanner();
        document.getElementById('topBar').style.display = 'none';
        document.getElementById('inputBar').style.display = 'none';
        setTimeout(() => loadWorkflows(), 500);
      }
    } else if (data.status === 'cancelled') {
      appendMessage('assistant', '已取消创建。');
      exitCreateMode();
    }
  } catch (err) {
    document.getElementById('chatInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    appendMessage('assistant', `错误：${escapeHTML(err.message)}`);
  } finally {
    if (thinkingId) removeThinking(thinkingId);
  }
}

// === Sidebar ===
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const expandBtn = document.getElementById('expandBtn');
  sidebarOpen = !sidebarOpen;
  sidebar.classList.toggle('collapsed');
  expandBtn.style.display = sidebarOpen ? 'none' : 'inline-block';
}

// === API Helpers ===
async function api(path, opts = {}) {
  const headers = { ...opts.headers };
  if (opts.method && opts.method !== 'GET') {
    headers['Content-Type'] = 'application/json';
  }
  const res = await fetch(path, { ...opts, headers });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// === Sidebar ===
async function loadWorkflows() {
  try {
    workflows = await api('/api/workflows');
  } catch {
    return;
  }
  const list = document.getElementById('workflowList');
  list.innerHTML = '';

  const projectItems = workflows.filter(w => w.source === 'project');
  const globalItems = workflows.filter(w => w.source === 'global' && !w.overridden);
  const allGlobal = workflows.filter(w => w.source === 'global'); // includes overridden for conflict check

  function addGroup(label, items) {
    if (items.length === 0) return;
    const groupLabel = document.createElement('div');
    groupLabel.className = 'wf-group-label';
    groupLabel.textContent = label;
    list.appendChild(groupLabel);
    for (const w of items) {
      const item = document.createElement('div');
      item.className = 'workflow-item' + (w.name === activeWorkflow ? ' active' : '');
      item.dataset.name = w.name;

      const nameSpan = document.createElement('span');
      nameSpan.className = 'wf-name-text';
      nameSpan.textContent = w.name;
      item.appendChild(nameSpan);

      if (w.source === 'global') {
        const src = document.createElement('span');
        src.className = 'wf-source';
        src.textContent = '全局';
        item.appendChild(src);
      }

      // Copy button (only show for project items, to copy to global)
      if (w.source === 'project') {
        const copyBtn = document.createElement('span');
        copyBtn.className = 'wf-copy';
        copyBtn.textContent = '📋';
        copyBtn.title = '复制到全局';
        copyBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          // Check if global already has a workflow with same name
          const existsInGlobal = allGlobal.some(g => g.name === w.name);
          if (existsInGlobal) {
            showConfirmModal(
              '覆盖确认',
              `全局中已存在 workflow "${w.name}"，确定要覆盖吗？`,
              async () => {
                await doCopyWorkflow(w.name);
              }
            );
          } else {
            await doCopyWorkflow(w.name);
          }
        });
        item.appendChild(copyBtn);

        // Delete button
        const delBtn = document.createElement('span');
        delBtn.className = 'wf-del';
        delBtn.textContent = '✕';
        delBtn.title = '删除 workflow';
        delBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          showConfirmModal(
            '删除确认',
            `确定要删除 workflow "${w.name}" 吗？此操作不可撤销。`,
            async () => {
              try {
                await api(`/api/workflows/${encodeURIComponent(w.name)}`, { method: 'DELETE' });
                if (activeWorkflow === w.name) selectWorkflow(null);
                await loadWorkflows();
                showToast(`已删除 "${w.name}"`, 'success');
              } catch (err) {
                showToast('删除失败：' + err.message, 'error');
              }
            }
          );
        });
        item.appendChild(delBtn);
      }

      item.addEventListener('click', () => selectWorkflow(w.name));
      list.appendChild(item);
    }
  }

  addGroup('项目', projectItems);
  addGroup('全局', globalItems);
}

async function selectWorkflow(name) {
  activeWorkflow = name;
  if (!name) {
    document.getElementById('topBar').style.display = 'none';
    document.getElementById('inputBar').style.display = 'none';
    document.querySelectorAll('.workflow-item').forEach(el => el.classList.remove('active'));
    return;
  }
  loadingMessages = name;
  document.querySelectorAll('.workflow-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.workflow-item').forEach(el => {
    if (el.dataset.name === name) el.classList.add('active');
  });
  document.getElementById('topBar').style.display = 'flex';
  document.getElementById('inputBar').style.display = 'flex';
  document.getElementById('wfName').textContent = name;
  // Reset code panel
  const panel = document.getElementById('codePanel');
  panel.classList.remove('open', 'transition');
  panel.style.width = '';
  document.getElementById('divider').classList.remove('show');
  codePanelOpen = false;
  codePanelFiles = [];
  cpCurrentFile = 'main.js';
  loadMessages(name);
}

async function loadMessages(name) {
  const area = document.getElementById('chatArea');
  area.innerHTML = '<div class="empty-state" style="display:none"></div>';
  try {
    const { messages } = await api(`/api/workflows/${encodeURIComponent(name)}/messages`);
    if (loadingMessages !== name) return; // stale response
    loadingMessages = false;
    messages.forEach(m => appendMessage(m.role, m.content, false));
    area.scrollTop = area.scrollHeight;
  } catch {
    if (loadingMessages === name) loadingMessages = false;
  }
}

// === Marked config: disable raw HTML for XSS safety ===
marked.use({
  renderer: {
    html(token) { return escapeHTML(token.text || token.raw || ''); }
  }
});

// === Chat ===
function appendMessage(role, content, doScroll = true) {
  const area = document.getElementById('chatArea');
  const empty = document.getElementById('emptyState');
  if (empty) empty.style.display = 'none';

  // Remove any thinking indicators when real messages arrive
  area.querySelectorAll('.thinking-indicator').forEach(el => el.remove());

  // content may be a content block array from tool_use loop; extract text blocks
  if (Array.isArray(content)) {
    // Skip messages that contain tool_use blocks (intermediate assistant responses)
    if (content.some(b => b.type === 'tool_use')) return;
    content = content.filter(b => b.type === 'text').map(b => b.text).join('\n');
  }

  // Skip empty messages (tool results, etc.)
  if (!content || !content.trim()) return;

  // Escape HTML, then render markdown via marked
  const formatted = marked.parse(content, { breaks: true, gfm: true });

  const div = document.createElement('div');
  div.className = `chat-msg ${role}`;
  div.innerHTML = formatted;

  // Highlight code blocks with hljs
  div.querySelectorAll('pre code').forEach(block => {
    hljs.highlightElement(block);
  });

  area.appendChild(div);
  if (doScroll) area.scrollTop = area.scrollHeight;
}

function appendThinking(id, label) {
  const area = document.getElementById('chatArea');
  const empty = document.getElementById('emptyState');
  if (empty) empty.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'chat-msg assistant thinking-indicator';
  div.id = id;
  div.innerHTML = `<span class="thinking-dots"><span>${escapeHTML(label || '处理中')}</span><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeThinking(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

async function sendMessage() {
  if (createMode) {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    appendMessage('user', text);
    await sendCreateMessage(text);
    return;
  }

  const input = document.getElementById('chatInput');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text || loadingSend || loadingRun || !activeWorkflow) return;

  input.value = '';
  loadingSend = true;
  btn.disabled = true;

  appendMessage('user', text);

  try {
    const data = await api(`/api/workflows/${encodeURIComponent(activeWorkflow)}/chat`, {
      method: 'POST',
      body: JSON.stringify({ message: text }),
    });
    appendMessage('assistant', data.reply);
  } catch (err) {
    appendMessage('assistant', `错误：${escapeHTML(err.message)}`);
  } finally {
    loadingSend = false;
    btn.disabled = loadingRun;
    input.focus();
  }
}

function onInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    sendMessage();
  }
}

// === Execute (SSE) ===
async function runWorkflow() {
  if (!activeWorkflow || loadingRun) return;
  loadingRun = true;
  document.getElementById('sendBtn').disabled = true;

  appendMessage('user', `执行 workflow "${activeWorkflow}"`);

  // Show progress modal
  const modal = document.getElementById('progressModal');
  const phasesEl = document.getElementById('progressPhases');
  const outputEl = document.getElementById('progressOutput');
  phasesEl.innerHTML = '';
  outputEl.innerHTML = '';
  outputEl.style.display = 'none';
  modal.classList.add('show');

  try {
    const res = await fetch(`/api/workflows/${encodeURIComponent(activeWorkflow)}/run`, { method: 'POST' });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let lastEvent = '';
    let resultText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (line.startsWith('event: ')) {
          lastEvent = line.slice(7).trim();
        } else if (line.startsWith('data: ')) {
          const data = JSON.parse(line.slice(6));
          if (lastEvent === 'phase') {
            const div = document.createElement('div');
            div.className = 'phase-item';
            div.innerHTML = '<span class="spinner">⟳</span> ' + escapeHTML(data);
            phasesEl.appendChild(div);
            phasesEl.scrollTop = phasesEl.scrollHeight;
          } else if (lastEvent === 'done') {
            resultText = data;
            // Mark all phases as completed
            phasesEl.querySelectorAll('.spinner').forEach(s => { s.textContent = '✓'; s.style.animation = 'none'; });
          } else if (lastEvent === 'error') {
            resultText = data;
            // Mark all phases as failed
            phasesEl.querySelectorAll('.spinner').forEach(s => { s.textContent = '✗'; s.style.animation = 'none'; });
          } else if (lastEvent === 'output') {
            outputEl.style.display = 'block';
            outputEl.textContent += data;
            outputEl.scrollTop = outputEl.scrollHeight;
          }
        }
      }
    }

    modal.classList.remove('show');
    appendMessage('assistant', resultText || '(无返回结果)');
  } catch (err) {
    modal.classList.remove('show');
    appendMessage('assistant', `执行失败：${escapeHTML(err.message)}`);
  } finally {
    loadingRun = false;
    document.getElementById('sendBtn').disabled = loadingSend;
  }
}

// === New Workflow ===
function showNewModal() {
  document.getElementById('newModal').classList.add('show');
}

function closeNewModal() {
  document.getElementById('newModal').classList.remove('show');
  document.getElementById('newName').value = '';
  document.getElementById('newDesc').value = '';
  document.getElementById('newDescRow').style.display = '';
  window._createModePending = false;
}

async function createWorkflow() {
  if (window._createModePending) {
    await startCreateSession();
    return;
  }
  const name = document.getElementById('newName').value.trim();
  const desc = document.getElementById('newDesc').value.trim();
  if (!name || !desc) return;

  closeNewModal();

  try {
    await api('/api/workflows', {
      method: 'POST',
      body: JSON.stringify({ name, description: desc }),
    });
    await loadWorkflows();
    selectWorkflow(name);
  } catch (err) {
    appendMessage('assistant', `创建失败：${err.message}`);
  }
}

async function doCopyWorkflow(name) {
  try {
    await api(`/api/workflows/${encodeURIComponent(name)}/copy`, {
      method: 'POST',
      body: JSON.stringify({ to: 'global' }),
    });
    await loadWorkflows();
    showToast(`已复制 "${name}" 到全局`, 'success');
  } catch (err) {
    showToast('复制失败：' + err.message, 'error');
  }
}

// === Code Panel ===
function highlightCode(el) {
  delete el.dataset.highlighted;
  hljs.highlightElement(el);
}

let cpDirty = false;
let cpHighlightTimer = null;

function doHighlight() {
  const textarea = document.getElementById('cpContent');
  const codeEl = document.getElementById('cpHighlight');
  const ext = cpCurrentFile.endsWith('.json') ? 'json' : 'javascript';
  codeEl.className = `language-${ext}`;
  codeEl.textContent = textarea.value;
  delete codeEl.dataset.highlighted;
  hljs.highlightElement(codeEl);
}

function syncCpScroll() {
  const textarea = document.getElementById('cpContent');
  const code = document.getElementById('cpHighlight');
  code.style.transform = `translate(${-textarea.scrollLeft}px, ${-textarea.scrollTop}px)`;
}

async function loadCpFile(filePath) {
  const textarea = document.getElementById('cpContent');
  const saveBtn = document.getElementById('cpSaveBtn');
  try {
    let content;
    if (codePanelFiles.length > 0) {
      const data = await api(`/api/workflows/${encodeURIComponent(activeWorkflow)}/file/${filePath}`);
      content = data.content;
    } else {
      const data = await api(`/api/workflows/${encodeURIComponent(activeWorkflow)}`);
      content = data.code;
    }
    textarea.value = content;
    doHighlight();
  } catch {
    textarea.value = '(加载失败)';
    document.getElementById('cpHighlight').textContent = '(加载失败)';
  }
  cpDirty = false;
  saveBtn.style.display = 'none';
  document.querySelectorAll('.cp-file').forEach(el => {
    el.classList.toggle('active', el.dataset.path === filePath);
  });
  cpCurrentFile = filePath;
}

function onCpEdit() {
  if (!cpDirty) {
    cpDirty = true;
    document.getElementById('cpSaveBtn').style.display = 'inline-block';
  }
  // Debounced highlight update
  clearTimeout(cpHighlightTimer);
  cpHighlightTimer = setTimeout(doHighlight, 100);
}

function onCpKeydown(e) {
  // Ctrl+S to save
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveCpFile();
    return;
  }
  // Tab for indentation
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = start + 2;
    onCpEdit();
  }
}

async function saveCpFile() {
  const textarea = document.getElementById('cpContent');
  const content = textarea.value;
  const saveBtn = document.getElementById('cpSaveBtn');
  try {
    if (codePanelFiles.length > 0) {
      await api(`/api/workflows/${encodeURIComponent(activeWorkflow)}/file/${cpCurrentFile}`, {
        method: 'PUT',
        body: JSON.stringify({ content }),
      });
    } else {
      await api(`/api/workflows/${encodeURIComponent(activeWorkflow)}`, {
        method: 'PUT',
        body: JSON.stringify({ code: content }),
      });
    }
    cpDirty = false;
    saveBtn.style.display = 'none';
    saveBtn.textContent = '✓ 已保存';
    setTimeout(() => { saveBtn.textContent = '保存'; }, 1500);
  } catch (err) {
    saveBtn.textContent = '✗ 失败';
    setTimeout(() => { saveBtn.textContent = '保存'; }, 2000);
  }
}

async function populateCpFileList() {
  const list = document.getElementById('cpFileList');
  try {
    const data = await api(`/api/workflows/${encodeURIComponent(activeWorkflow)}/files`);
    codePanelFiles = data.files || [];
  } catch {
    codePanelFiles = [];
  }
  list.innerHTML = '';
  if (codePanelFiles.length === 0) {
    const item = document.createElement('div');
    item.className = 'cp-file active';
    item.textContent = 'main.js';
    list.appendChild(item);
    return;
  }

  // Build tree from flat paths
  const tree = {};
  for (const f of codePanelFiles) {
    const parts = f.split('/');
    let node = tree;
    for (const p of parts) {
      if (!node[p]) node[p] = {};
      node = node[p];
    }
    node._file = true;
  }

  function renderNode(node, parentEl, depth, prefix) {
    const keys = Object.keys(node).filter(k => k !== '_file').sort();
    for (const key of keys) {
      const isDir = !node[key]._file;
      const fullPath = prefix ? prefix + '/' + key : key;
      const row = document.createElement('div');
      row.className = 'cp-file' + (isDir ? ' dir' : '');
      row.style.paddingLeft = (12 + depth * 16) + 'px';
      row.dataset.path = fullPath;

      if (isDir) {
        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = '▶';
        row.appendChild(arrow);
        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = '📁';
        row.appendChild(icon);
        const label = document.createElement('span');
        label.textContent = key;
        row.appendChild(label);

        const children = document.createElement('div');
        children.className = 'cp-children collapsed';

        row.addEventListener('click', (e) => {
          e.stopPropagation();
          const isCollapsed = children.classList.toggle('collapsed');
          arrow.textContent = isCollapsed ? '▶' : '▼';
        });

        parentEl.appendChild(row);
        parentEl.appendChild(children);
        renderNode(node[key], children, depth + 1, fullPath);
      } else {
        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.innerHTML = '&nbsp;&nbsp;';
        row.appendChild(arrow);
        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = '📄';
        row.appendChild(icon);
        const label = document.createElement('span');
        label.textContent = key;
        row.appendChild(label);

        row.addEventListener('click', () => loadCpFile(fullPath));
        parentEl.appendChild(row);
      }
    }
  }

  renderNode(tree, list, 0, '');
}

async function toggleCodePanel() {
  const panel = document.getElementById('codePanel');
  const divider = document.getElementById('divider');
  if (codePanelOpen) {
    panel.classList.remove('open', 'transition');
    panel.style.width = '';
    divider.classList.remove('show');
    codePanelOpen = false;
    return;
  }
  if (!activeWorkflow) return;
  panel.classList.add('open', 'transition');
  divider.classList.add('show');
  codePanelOpen = true;

  // Set initial width to 50% of available space (equal to chat area)
  const container = panel.parentElement;
  const availWidth = container.offsetWidth - (divider.offsetWidth || 5);
  panel.style.width = Math.min(availWidth / 2, 800) + 'px';

  // Load file list (always refresh on open)
  await populateCpFileList();

  // Load current file content
  await loadCpFile(cpCurrentFile);
}

// === Modal overlay click-to-close ===
document.getElementById('newModal').addEventListener('click', function(e) {
  if (e.target === this) closeNewModal();
});
document.getElementById('confirmModal').addEventListener('click', function(e) {
  if (e.target === this) closeConfirmModal();
});
// Progress modal: prevent close on overlay click
document.getElementById('progressModal').addEventListener('click', function(e) {
  if (e.target === this) return; // do nothing
});

// === Confirm Modal ===
let confirmCallback = null;

function showConfirmModal(title, text, onOk) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;
  confirmCallback = onOk;
  document.getElementById('confirmModal').classList.add('show');
}

function closeConfirmModal() {
  document.getElementById('confirmModal').classList.remove('show');
  confirmCallback = null;
}

document.getElementById('confirmOkBtn').addEventListener('click', function() {
  if (confirmCallback) {
    const cb = confirmCallback;
    closeConfirmModal();
    cb();
  }
});

// === Toast ===
let toastTimer = null;

function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type || 'info') + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2000);
}

// === Textarea auto-resize ===
document.getElementById('chatInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// === Draggable divider ===
const divider = document.getElementById('divider');
const codePanel = document.getElementById('codePanel');

divider.addEventListener('mousedown', function(e) {
  e.preventDefault();
  divider.classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';

  const startX = e.clientX;
  const startWidth = codePanel.offsetWidth;
  const containerWidth = codePanel.parentElement.offsetWidth;

  function onMove(ev) {
    const delta = startX - ev.clientX;
    const newWidth = Math.max(200, Math.min(containerWidth - 300, startWidth + delta));
    codePanel.style.width = newWidth + 'px';
  }

  function onUp() {
    divider.classList.remove('active');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

// === Init ===
loadWorkflows();
